# Render Blueprint: Render > New > Blueprint, then pick this repo.
# Secret values (sync: false) are typed into the Render dashboard, never stored here.
services:
  - type: web
    name: traceback-technology-website
    runtime: node
    plan: starter # free instances block outgoing SMTP, see README "Deployment"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
