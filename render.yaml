# Render Blueprint: Render > New > Blueprint, then pick this repo.
# Email (the feedback form) is not set up yet. When it is, add the SMTP_* and
# CONTACT_RECEIVER_EMAIL settings under the service's Environment tab (see README "Deployment").
services:
  - type: web
    name: traceback-technology-website
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
